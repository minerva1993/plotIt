'combined_GreaterTwoBTag_GreaterOneJet_nBJets':
  y-axis-format: "Events"
  x-axis: ' '
  for-yields: true
  rebin-arr: [0.0, 6.0]
  sort-by-yields: true
  rename:
    - {from: 'combined_GreaterTwoBTag_GreaterOneJet_nBJets', to: 'll_GreaterTwoBTag_GreaterOneJet_nBJets'}
  labels:
    - {text: 'ee+e#mu+#mu#mu', position: [0.77, .725], font: 44, size: 14}
    - {text: 'N_{b jet} #geq 3', position: [0.77, .68], font: 44, size: 14}
  save-extensions: ['pdf', 'png']
  yields-table-order: 2
  yields-title: '$\ell\ell$, $\textrm{N}_{\textrm{b-jet}} \geq 3$'

